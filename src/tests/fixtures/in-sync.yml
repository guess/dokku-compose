# Declares every resource dokku-compose manages. src/tests/in-sync.test.ts
# pairs it with a fake server whose state equals it: `diff` must report the
# box in sync and `up --dry-run` must run no command.
dokku:
  version: "0.38.32"

plugins:
  postgres:
    url: https://github.com/dokku/dokku-postgres.git
    version: "2.4.0"
  redis:
    url: https://github.com/dokku/dokku-redis.git

docker_auth:
  registry.example.com:
    username: bot
    password: s3cret

env:
  TZ: UTC
  FEATURE_X: true

networks:
  - backend-net

network:
  attach_post_deploy:
    - backend-net
  tld: internal
  bind_all_interfaces: false

volumes:
  uploads: {}               # default location, chowned to herokuish
  data:
    chown: 1000
    mode: "0750"
  media:
    path: /srv/media        # an existing directory; owner and mode are left alone

domains:
  - example.com

nginx:
  client-max-body-size: "20m"

logs:
  max-size: "50m"
  vector-sink: "console://?encoding[codec]=json"

scheduler: docker-local

registry:
  server: registry.example.com
  push-on-release: true

checks:
  wait-to-retire: 30

ps:
  restart-policy: "on-failure:5"
  stop-timeout-seconds: 45

build:
  selected: dockerfile
  skip_cleanup: true
  dockerfile: Dockerfile
  app_json: app.json

proxy:
  type: nginx
  proxy_port: 80

git:
  deploy_branch: main
  keep_git_dir: true
  archive_max_files: 20000

postgres:
  myapp-db:
    version: "17-3.5"
    image: postgis/postgis
    properties:
      memory: 512
      shm-size: 256m
      restart-policy: unless-stopped
      post-create-network: [backend-net, other-net]
      custom-env:
        TZ: UTC
        PGOPTIONS: "-c work_mem=8MB"
      password: Zq7-Hk9vbn2
      volume-targets:
        data: /var/lib/postgresql/data
    mounts:
      - /var/lib/dokku/data/storage/myapp-db-extra:/opt/extra
      - dbvol:/opt/data:ro

  myapp-reports:
    backup:
      schedule: "30 2 * * *"
      bucket: backups/myapp-reports
      auth: { access_key_id: KEY, secret_access_key: SECRET, region: auto, signature_version: s3v4, endpoint: "https://s3.example.com" }
      encryption: { public_key_id: ABCD1234ABCD1234, keyserver: "hkp://keys.example.com" }

redis:
  myapp-redis:
    version: "7.2-alpine"
    properties:
      memory: 128
      log-driver: json-file
      log-opt: [max-size=10m, max-file=3]
      wait-timeout: 90
      config-options: "--maxmemory-policy allkeys-lru"
      service-memory: 64
    mounts: []
    backup:
      schedule: "0 * * * *"
      bucket: backups/myapp-redis
      auth: { access_key_id: KEY, secret_access_key: SECRET, region: auto, signature_version: s3v4, endpoint: "https://s3.example.com" }
      encryption: { passphrase: in-sync-passphrase }
      storage_class: STANDARD_IA
      object_name: cache/latest
      mailto: ops@example.com
      timestamp: false

apps:
  myapp:
    domains:
      - myapp.example.com
      - www.myapp.example.com
    links:
      - myapp-db
      - myapp-reports
      - service: myapp-redis
        alias: CACHE
        querystring: "timeout=5"
    ports:
      - "http:80:5000"
      - "https:443:5000"
    env:
      APP_ENV: production
    ssl:
      certfile: src/tests/fixtures/certs/myapp.crt
      keyfile: src/tests/fixtures/certs/myapp.key
    storage:
      - uploads:/app/uploads
      - entry: data
        container_dir: /app/data
        readonly: true
        phases: [deploy]
      - entry: media
        container_dir: /app/media
        process_type: worker
        options: [Z]
    proxy:
      enabled: true
    networks:
      - backend-net
    network:
      attach_post_create:
        - backend-net
      initial_network: bridge
      bind_all_interfaces: true
      static_web_listener: false
      tld: internal
    nginx:
      client-max-body-size: "15m"
    logs:
      max-size: "10m"
      vector-sink: "console://?encoding[codec]=json"
    registry:
      server: registry.example.com
    scheduler: docker-local
    scale:
      web: 2
      worker: 1
    ps:
      restart-policy: "on-failure:10"
      stop-timeout-seconds: 60
    checks:
      disabled:
        - worker
      skipped:
        - release
      wait-to-retire: 60
    build:
      dockerfile: docker/Dockerfile
      app_json: docker/app.json
      context: apps/myapp
      args:
        NODE_ENV: production
        GREETING: "hello big world"
        API_URL: "https://api.example.com/v1?debug=1"
    docker_options:
      deploy:
        - "--shm-size 256m"
      run:
        - "--ulimit nofile=12"

  myapp-worker:
    domains: false
    ssl: false
    checks: false
    git:
      deploy_branch: release

  myapp-edge:
    ssl: true
    env_external:
      - SET_BY_SCRIPT
