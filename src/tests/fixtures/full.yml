dokku:
  version: "0.38.32"

plugins:
  postgres:
    url: https://github.com/dokku/dokku-postgres.git
    version: "1.41.0"
  redis:
    url: https://github.com/dokku/dokku-redis.git

docker_auth:
  ghcr.io:
    username: "ci-user"
    password: "test-pat"

networks:
  - studio-net
  - backend-net

volumes:
  uploads:
    chown: herokuish
    mode: "0750"

postgres:
  myapp-db:
    version: "17-3.5"
    image: postgis/postgis
  studio-postgres: {}
  otherapp-db: {}

redis:
  myapp-redis:
    version: "7.2-alpine"
  studio-redis: {}
  otherapp-redis: {}

apps:
  myapp:
    domains:
      - myapp.example.com
      - api.myapp.example
    build:
      dockerfile: docker/prod/api/Dockerfile
      app_json: docker/prod/api/app.json
      context: apps/myapp-api
      args:
        SENTRY_AUTH_TOKEN: "test-token"
    ports:
      - "https:4001:4000"
    ssl:
      certfile: certs/myapp.example/server.crt
      keyfile: certs/myapp.example/server.key
    links:
      - myapp-db
      - myapp-redis
    checks:
      wait-to-retire: 60
    storage:
      - uploads:/app/uploads
    registry:
      push-on-release: true
      server: registry.example.com
    env:
      APP_ENV: staging

  studio:
    build:
      context: apps/studio-api
    ports:
      - "https:4002:4000"
    ssl:
      certfile: certs/example.com/server.crt
      keyfile: certs/example.com/server.key
    links:
      - studio-postgres
      - studio-redis
    logs:
      max-size: "10m"
    networks:
      - studio-net

  otherapp:
    build:
      context: apps/otherapp-api
    ports:
      - "https:4003:4000"
    ssl:
      certfile: certs/otherapp.example/server.crt
      keyfile: certs/otherapp.example/server.key
    links:
      - otherapp-db
      - otherapp-redis
    nginx:
      client-max-body-size: "15m"
    scheduler: docker-local
    docker_options:
      deploy:
        - "--shm-size 256m"
    networks:
      - backend-net

  otherapp-sandbox:
    build:
      dockerfile: docker/prod/sandbox/Dockerfile
      context: apps/otherapp-sandbox
    ports:
      - "http:4004:4000"
    proxy:
      enabled: false
    networks:
      - backend-net
